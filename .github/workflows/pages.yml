# Publishes the site from two branches at once:
#   main                          -> www.abbymartin.net/
#   ascii_world branch's folder   -> www.abbymartin.net/ascii/
# Runs whenever either branch is pushed, or by hand from the Actions tab.
# This file has to exist on both branches.
name: pages

on:
  push:
    branches: [main, ascii_world]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/checkout@v4
        with:
          ref: ascii_world
          path: ascii

      - name: Combine both branches into one site
        run: |
          mkdir site
          rsync -a --exclude .git --exclude .github --exclude .claude --exclude .vscode main/ site/
          cp -r ascii/ascii_world site/ascii

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
